# MagicQ Venue Companion configuration (unattended venue edition)
#
# Compatible drop-in with MagicQ Companion control channels 1-9.
# Both T14 and T15 run the universal adaptive Genre Agent by default.

[network]
# Local network interface to send from ("" = system default). e.g. "eth0".
interface = ""
# Unicast destination IP (used when [artnet] mode = "unicast").
ip = "127.0.0.1"

[artnet]
# Audio analysis -> MagicQ. protocol = "artnet" | "sacn"
protocol = "sacn"
# Destination: Art-Net = unicast|broadcast|localhost; sACN = unicast|multicast|localhost.
mode = "localhost"
# UDP port (Art-Net 6454, sACN 5568).
port = 5568
# Universe: Art-Net is often 0-based; sACN uses 1-63999 (default 10 on MagicQ localhost).
universe = 10
# How many DMX frames per second to send.
fps = 40
# sACN source priority (0-200).
priority = 100
# Live dashboard Output switch. Boot / process start uses [server] startup_output.
enabled = true

[server]
# Output switch after Companion starts or host reboots.
startup_output = true
reboot_enabled = false
reboot_time = "14:00"
reboot_days = ["mon", "tue", "wed", "thu", "fri"]
# Seconds between automatic capture reconnect attempts if USB/PipeWire resets.
audio_reconnect_seconds = 3.0

[audio]
noise_floor_db = -55
samplerate = 44100
blocksize = 512
# Substring of the input device name ("" or "pipewire" = system default input).
# Run `python -m magicq_companion --list-devices` to see options.
device = "pipewire"
# Analyse left, right, or both (average). Use left for a mono card.
input_channel = "left"

[genre]
# Offline ONNX music genre classifier + continuous archetype blending.
enabled = true
# "auto" = adapt dynamically to any genre played, or lock one archetype:
# ambient_chill | groovy_warm | house_tech | melodic_prog | club_peak | hiphop_urban | fast_bass | rock_live
mode = "auto"
interval_seconds = 3.0
smooth_seconds = 12.0
model_path = ""

# DMX channel assignments (1-based addresses within the universe).
# Section channels are 255 while that section is active, 0 otherwise.
[channels]
groove = 1
breakdown = 2
buildup = 3
drop = 4
# Continuous 0-255 ramp that rises during a build-up and slams to 255 on the drop.
build_progress = 5
# Toggles 0<->255 on every detected kick (hard edges for MagicQ BPM input).
beat_pulse = 6
# 255 at DROP start for drop_hit_seconds, then fades over drop_hit_fade_seconds.
drop_hit = 7
# 255 while a 4/4 kick grid is locked, 0 when it isn't.
four_four = 8
# Chase speed vs BPM from intrinsic pace + genre: 255=full, 128=1/2, 64=1/4, 32=1/8.
bpm_rate = 9
drop_momentary = 10

# Safety floor/ceiling for DMX channel 9 (bpm_rate).
# Within this band, the Genre Agent and Intrinsic Pace Score steer chase speed.
[bpm_rate]
min = "eighth"
max = "full"
decay_seconds = 3

[detection]
kick_absent_below = 0.45
kick_present_above = 0.80
build_score_on = 0.5
evidence_seconds = 2.0
min_dwell_seconds = 6.0
drop_hold_seconds = 10
build_timeout_seconds = 30.0
expected_build_seconds = 12.0
drop_energy_jump = 1.35
drop_rise_window = 0.5
drop_rise = 0.4
drop_min_bass = 0.7
drop_min_state_seconds = 0.15
drop_hit_seconds = 0.15
drop_hit_fade_seconds = 0
drop_smooth_seconds = 0.08
drop_from_groove = true
drop_use_onset = true
baseline_seconds = 45.0
build_intensity = 0.55
drop_intensity = 0.55
build_decay_seconds = 8
four_four_intensity = 0.55
four_four_smooth_seconds = 0.4
breakdown_intensity = 0.55
breakdown_beats = 4
# Manual style override: auto | club | long_build | punchy | breakdown
style = "auto"
silence_gate = true
silence_timeout_seconds = 600

[build_score]
weight_energy = 0.24
weight_treble = 0.20
weight_onsets = 0.16
weight_lift = 0.20
weight_divergence = 0.12
weight_activity = 0.08
full_scale_energy_slope = 0.04
full_scale_treble_slope = 0.05
full_scale_onset_slope = 0.8
full_scale_lift = 0.18
full_scale_activity = 2.5

[ui]
visualizer = true
visualizer_mode = "auto"
