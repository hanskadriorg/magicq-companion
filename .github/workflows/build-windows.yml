name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: PyInstaller
        run: |
          pyinstaller --noconfirm --clean packaging/magicq_audio_bridge.spec
          copy config.toml dist\MagicQAudioBridge\config.toml

      - name: Zip portable build
        run: |
          Compress-Archive -Path dist\MagicQAudioBridge\* -DestinationPath dist\MagicQAudioBridge-windows.zip

      - name: Install WiX
        run: dotnet tool install --global wix

      - name: Build MSI
        id: msi
        continue-on-error: true
        run: |
          wix build packaging\Product.wxs "-d" "PayloadDir=$PWD\dist\MagicQAudioBridge" -o dist\MagicQAudioBridge.msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: magicq-audio-bridge-windows
          path: |
            dist/MagicQAudioBridge-windows.zip
            dist/MagicQAudioBridge.msi
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MagicQAudioBridge-windows.zip
            dist/MagicQAudioBridge.msi
          fail_on_unmatched_files: false
